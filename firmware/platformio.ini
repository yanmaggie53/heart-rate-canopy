; PlatformIO settings for the canopy firmware. Run these from this folder (firmware/):
;
;   pio run -t upload          compile the light test and upload it to the ESP32
;   pio device monitor         watch what the ESP32 prints (Ctrl+C to quit)
;
; Each sketch in src/ is its own environment. The light test is the default; later sketches
; get their own [env:...] block and are uploaded with `pio run -e <name> -t upload`.
;
; Board: an ESP32-S3 dev board with an ESP32-S3-WROOM-2 module and two micro-USB ports (USB and UART).
;   The laptop goes on the port labeled USB: the S3's own USB, no driver needed, shows up as
;   /dev/cu.usbmodem*. ARDUINO_USB_CDC_ON_BOOT=1 sends Serial there. (On the UART port the
;   messages wouldn't appear unless that flag is removed.)
;   The very first upload over this port needs the board in download mode by hand: hold BOOT,
;   tap RST, let go of BOOT. After that, uploads reset the board on their own.
;   WROOM-2 runs its flash and PSRAM in octal mode, so memory_type must be opi_opi or the board won't
;   boot. PlatformIO then uploads in dout mode and boots in opi mode on its own.
;   esptool reads this one as ESP32-S3 rev v0.2 with 32 MB octal flash and 16 MB PSRAM, both 1.8 V
;   (WROOM-2 N32R16V). Flash size is left at the board default of 8 MB, which is plenty.
;   On a WROOM-2, GPIO 35, 36 and 37 belong to the memory chips: don't wire anything to them.

[platformio]
default_envs = light_test

[env]
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = opi_opi
framework = arduino
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1
; Name the port so PlatformIO never picks a Bluetooth headphone port by mistake.
upload_port = /dev/cu.usbmodem*
monitor_port = /dev/cu.usbmodem*
; On the S3's own USB, esptool's usual reset after an upload lands back in download mode
; ("waiting for download") instead of starting the sketch. A watchdog reset starts it.
; Same reason the monitor leaves DTR/RTS at their defaults: toggling them resets the board.
board_upload.after_reset = watchdog-reset
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    fastled/FastLED@3.10.9

; Wiring check: counts the lights, checks color order, then sweeps the canopy palette.
[env:light_test]
build_src_filter = +<light_test.cpp>
