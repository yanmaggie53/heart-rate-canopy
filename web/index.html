<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canopy Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500&family=Nunito:wght@300;400;600;700&display=swap">
<style>
/* Layout: a black field with the fairy lights (the canopy), a large reading, and one small card at the bottom with the two things you need: token and connect. Everything else folds away under "tuning".
   Look: the lights are the only color. Type is rounded and soft (Fredoka for the number, Nunito for everything else), all lowercase, with a faint glow in the current light color. Cozy, not sharp. */
:root {
  --bg: #000;
  --fg: #f3eee6;
  --muted: rgba(243,238,230,0.6);
  --panel: rgba(10,10,12,0.72);
  --line: rgba(243,238,230,0.14);
  --accent: #e8c27a;
  --ok: #7fd7a8;
  --bad: #f08a7c;
  --glow: hsl(280 90% 65% / 0.55);   /* set from the current light color by the script */
  --display: "Fredoka", "Nunito", "Varela Round", "Arial Rounded MT Bold", sans-serif;
  --body: "Nunito", "Varela Round", "Arial Rounded MT Bold", "Helvetica Neue", sans-serif;
  --mono: var(--body);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 14px; line-height: 1.45; overflow: hidden; text-transform: lowercase; -webkit-font-smoothing: antialiased; }
button, input, select { font-family: inherit; text-transform: inherit; }
#canopy { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

.readout {
  position: fixed; inset: 0 0 auto 0;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding-block: 9vh 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none; text-align: center;
}
.readout .bpm { font-family: var(--display); font-weight: 400; font-size: clamp(80px, 18vw, 180px); line-height: 1; font-variant-numeric: tabular-nums; color: #fff; text-shadow: 0 0 32px var(--glow), 0 0 4px var(--glow); }
.readout .label { letter-spacing: 0.1em; font-size: 12px; color: var(--muted); text-shadow: 0 0 14px var(--glow); }
.readout .sub { font-size: 15px; color: var(--muted); max-width: 36ch; text-wrap: balance; text-shadow: 0 0 14px var(--glow); }

.card {
  position: fixed; left: 50%; bottom: 0; transform: translateX(-50%);
  width: min(560px, 100% - 32px);
  margin-bottom: max(36px, env(safe-area-inset-bottom, 0px) + 28px);
  background: var(--panel); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--line); border-radius: 14px;
  padding: 18px 20px 20px;
  display: flex; flex-direction: column; gap: 14px;
  max-height: calc(100vh - 36vh); overflow-y: auto;
}
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.top h1 { font-family: var(--display); font-weight: 400; font-size: 19px; margin: 0; }
.status { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); }
.status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.status.ok { color: var(--ok); } .status.ok::before { background: var(--ok); box-shadow: 0 0 10px var(--ok); }
.status.bad { color: var(--bad); } .status.bad::before { background: var(--bad); }

.row { display: flex; gap: 8px; align-items: center; }
.row > * { min-width: 0; }
input[type=password], input[type=text] { flex: 1; background: rgba(255,255,255,0.06); border: 1px solid var(--line); color: var(--fg); border-radius: 10px; padding: 10px 12px; font: 13px var(--body); }
button { background: var(--accent); color: #1a1407; border: 0; border-radius: 10px; padding: 10px 16px; font: 700 13px var(--body); cursor: pointer; white-space: nowrap; }
button.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); font-weight: 500; }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.sim { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 12px; }
.sim input[type=range] { flex: 1; width: auto; accent-color: var(--accent); }
.sim .v { font-size: 12px; min-width: 6ch; text-align: right; font-variant-numeric: tabular-nums; }

details { border-top: 1px solid var(--line); padding-top: 10px; }
summary { cursor: pointer; font-size: 12px; letter-spacing: 0.08em; color: var(--muted); list-style: none; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "  +"; } details[open] summary::after { content: "  –"; }
.tune { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
label { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13px; }
label .v { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
input[type=range] { width: 46%; accent-color: var(--accent); }
input[type=checkbox] { accent-color: var(--accent); }
.hint { font-size: 12px; color: var(--muted); margin: 0; }
.swatches { display: flex; height: 8px; border-radius: 4px; overflow: hidden; }
.swatches i { flex: 1; }
.ticks { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: -4px; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>

<canvas id="canopy" aria-hidden="true"></canvas>

<div class="readout">
  <div class="label" id="srcLabel">waiting for heart rate</div>
  <div class="bpm" id="bpm">--</div>
  <div class="sub" id="sub">Paste your Pulsoid token below and connect.</div>
</div>

<div class="card">
  <div class="top">
    <h1>Canopy Prototype</h1>
    <span class="status" id="status">not connected</span>
  </div>

  <div class="row">
    <input type="password" id="token" placeholder="Pulsoid access token" autocomplete="off">
    <button id="connect" type="button">Connect</button>
  </div>

  <details>
    <summary>Tuning</summary>
    <div class="tune">
      <label>Purple at <input type="range" id="floor" min="40" max="80" value="55"> <span class="v" id="floorV">55 bpm</span></label>
      <label>Red at <input type="range" id="ceil" min="70" max="130" value="95"> <span class="v" id="ceilV">95 bpm</span></label>
      <div class="swatches" id="swatches"></div>
      <div class="ticks"><span id="tickLo">55</span><span id="tickMid">75</span><span id="tickHi">95 bpm</span></div>
      <label>Smoothing <input type="range" id="smooth" min="0" max="30" value="5"> <span class="v" id="smoothV">5 s</span></label>
      <label>Stepped palette, one color per <input type="range" id="step" min="1" max="6" value="2"> <span class="v" id="stepV">2 bpm</span></label>
      <label><span><input type="checkbox" id="stepped"> use stepped palette</span></label>
      <label>Started at <span class="v" id="startV">average of the first 30 s</span></label>
      <div class="row"><button class="ghost" id="copyLog" type="button">Copy session as CSV</button><span class="hint" id="copied"></span></div>
      <div class="sim">
        <input type="checkbox" id="simOn" title="Test without a watch">
        <span>Test without a watch</span>
        <input type="range" id="sim" min="45" max="120" value="75">
        <span class="v" id="simV">75 bpm</span>
      </div>
      <p class="hint">Test mode feeds an exact fake reading so each color can be checked without a watch. Connecting to Pulsoid turns it off.</p>
    </div>
  </details>
</div>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const state = { ws: null, simTimer: null, smoothed: null, start: null, firstSampleAt: null, samples: [], opening: [], log: [], hue: 280 };

  // ---------- mapping: a fixed scale in bpm ----------
  // Tuned for people sitting in a gallery, mostly students: purple at the floor (55 bpm by default), red at the ceiling (95).
  // Hue runs down the wheel from purple (280) through blue, cyan, green, yellow and orange to red (0): about 7 degrees per bpm
  // with the default range, so a change of one beat per minute is a visible shift. t = 0 at the floor, 1 at the ceiling.
  const HUE_LOW = 280, HUE_HIGH = 0;
  const floorBpm = () => +$('floor').value;
  const ceilBpm = () => Math.max(floorBpm() + 5, +$('ceil').value);
  function targetT() {
    if (state.smoothed == null) return null;
    let hr = state.smoothed;
    if ($('stepped').checked) { const s = +$('step').value; hr = Math.round(hr / s) * s; }
    return Math.max(0, Math.min(1, (hr - floorBpm()) / (ceilBpm() - floorBpm())));
  }
  const hueFor = t => HUE_LOW - (HUE_LOW - HUE_HIGH) * Math.max(0, Math.min(1, t));
  function drawSwatches() {
    const el = $('swatches'); el.innerHTML = '';
    for (let i = 0; i < 40; i++) { const s = document.createElement('i'); s.style.background = `hsl(${hueFor(i / 39)} 85% 55%)`; el.appendChild(s); }
    $('tickLo').textContent = floorBpm(); $('tickMid').textContent = Math.round((floorBpm() + ceilBpm()) / 2); $('tickHi').textContent = ceilBpm() + ' bpm';
    $('floorV').textContent = floorBpm() + ' bpm'; $('ceilV').textContent = ceilBpm() + ' bpm';
  }

  // ---------- readings ----------
  function pushSample(hr, source) {
    const now = Date.now();
    state.samples.push({ t: now, hr });
    const win = +$('smooth').value * 1000;
    state.samples = state.samples.filter(s => now - s.t <= Math.max(win, 1));
    state.smoothed = win === 0 ? hr : state.samples.reduce((a, s) => a + s.hr, 0) / state.samples.length;
    if (!state.firstSampleAt) state.firstSampleAt = now;
    // "Started at" is the average of the first 30 s. It only feeds the line under the reading; the color is on the fixed scale.
    if (state.start == null) { state.opening.push(hr); if (now - state.firstSampleAt >= 30000) setStart(); }
    state.hue = hueFor(targetT());
    state.log.push(`${new Date(now).toISOString().slice(11, 19)},${hr},${state.smoothed.toFixed(1)},${state.hue.toFixed(0)}`);
    $('bpm').textContent = Math.round(hr);
    $('srcLabel').textContent = source;
    if (state.start == null) { $('sub').textContent = 'Sit still and breathe slowly. A slower heart turns the canopy cooler.'; }
    else {
      const d = Math.round(state.smoothed - state.start);
      $('sub').textContent = d <= -1 ? `${-d} bpm lower than when you sat down.` : d >= 1 ? `${d} bpm higher than when you sat down.` : 'Same as when you sat down.';
    }
  }
  function setStart() { state.start = Math.round(state.opening.reduce((a, b) => a + b, 0) / state.opening.length); $('startV').textContent = state.start + ' bpm'; }
  function resetSession() { state.start = null; state.opening = []; state.samples = []; state.smoothed = null; state.firstSampleAt = null; $('startV').textContent = 'average of the first 30 s'; }

  // ---------- Pulsoid websocket ----------
  function setStatus(text, cls) { const s = $('status'); s.textContent = text; s.className = 'status' + (cls ? ' ' + cls : ''); }
  function connect() {
    const token = $('token').value.trim();
    if (!token) { setStatus('paste a token first', 'bad'); return; }
    try { localStorage.setItem('pulsoid_token', token); } catch (e) {}
    disconnect();
    if ($('simOn').checked) { $('simOn').checked = false; stopSim(); resetSession(); }   // a fake session must not carry into a live one
    setStatus('connecting…');
    const ws = new WebSocket(`wss://dev.pulsoid.net/api/v1/data/real_time?access_token=${encodeURIComponent(token)}`);
    state.ws = ws;
    ws.onopen = () => setStatus('connected, waiting for a reading', 'ok');
    ws.onmessage = ev => {
      let hr = null;
      try { const j = JSON.parse(ev.data); hr = j?.data?.heart_rate ?? j?.heart_rate ?? null; } catch (e) { hr = parseInt(ev.data, 10); }
      if (hr && hr > 20 && hr < 250) { setStatus('live', 'ok'); pushSample(hr, 'live heart rate'); }
    };
    ws.onerror = () => setStatus('could not connect. Check the token and that the watch is measuring.', 'bad');
    ws.onclose = ev => { if (state.ws === ws) { state.ws = null; if (ev.code === 1000) setStatus('not connected'); else { setStatus('connection dropped, retrying', 'bad'); setTimeout(() => { if (!state.ws && !$('simOn').checked) connect(); }, 5000); } } };
    $('connect').textContent = 'Reconnect';
  }
  function disconnect() { if (state.ws) { const w = state.ws; state.ws = null; w.close(1000); } }

  // ---------- test mode: an exact fake reading, once a second and whenever the slider moves ----------
  function startSim() { disconnect(); setStatus('simulating', 'ok'); tickSim(); state.simTimer = setInterval(tickSim, 1000); }
  function tickSim() { pushSample(+$('sim').value, 'simulated heart rate'); }
  function stopSim() { clearInterval(state.simTimer); if (!state.ws) setStatus('not connected'); }

  // ---------- canopy drawing ----------
  const canvas = $('canopy'), ctx = canvas.getContext('2d');
  let lights = [], shownHue = 280, shownT = 0.5;
  function resize() {
    canvas.width = innerWidth * devicePixelRatio; canvas.height = innerHeight * devicePixelRatio;
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    const n = Math.round((innerWidth * innerHeight) / 7000);
    lights = Array.from({ length: n }, () => ({ x: Math.random() * innerWidth, y: Math.random() * innerHeight * 0.72, r: 1.8 + Math.random() * 2.6, ph: Math.random() * Math.PI * 2, tw: 0.6 + Math.random() * 0.8 }));
  }
  function frame(now) {
    const t = targetT();
    if (t != null) state.hue = hueFor(t);                 // re-evaluated every frame so the Tuning sliders apply at once
    shownHue += (((state.hue - shownHue + 540) % 360) - 180) * 0.03;
    shownT += ((t == null ? 0.5 : t) - shownT) * 0.03;
    const bpm = state.smoothed ?? 70;
    const beat = 0.5 + 0.5 * Math.sin((now / 1000) * (bpm / 60) * 2 * Math.PI);   // the lights breathe at the current heart rate
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, innerWidth, innerHeight);   // the field stays black; only the lights carry color
    for (const l of lights) {
      const a = (0.45 + 0.45 * beat * (0.4 + 0.6 * shownT)) * (0.75 + 0.25 * Math.sin(now / 1000 * l.tw + l.ph));
      ctx.beginPath(); ctx.arc(l.x, l.y, l.r * 7, 0, Math.PI * 2); ctx.fillStyle = `hsl(${shownHue} 95% 55% / ${a * 0.12})`; ctx.fill();   // soft halo, as through fabric
      ctx.beginPath(); ctx.arc(l.x, l.y, l.r * 3, 0, Math.PI * 2); ctx.fillStyle = `hsl(${shownHue} 95% 60% / ${a * 0.35})`; ctx.fill();
      ctx.beginPath(); ctx.arc(l.x, l.y, l.r, 0, Math.PI * 2); ctx.fillStyle = `hsl(${shownHue} 90% 72% / ${a})`; ctx.fill();
    }
    document.documentElement.style.setProperty('--glow', `hsl(${shownHue} 90% 65% / 0.55)`);   // the text glows faintly in the same color
    requestAnimationFrame(frame);
  }

  // ---------- wiring ----------
  $('connect').onclick = connect;
  $('token').addEventListener('keydown', e => { if (e.key === 'Enter') connect(); });
  $('simOn').onchange = () => $('simOn').checked ? startSim() : stopSim();
  $('sim').oninput = () => { $('simV').textContent = $('sim').value + ' bpm'; if ($('simOn').checked) tickSim(); };
  $('floor').oninput = $('ceil').oninput = drawSwatches;
  $('smooth').oninput = () => $('smoothV').textContent = $('smooth').value + ' s';
  $('step').oninput = () => $('stepV').textContent = $('step').value + ' bpm';
  $('copyLog').onclick = () => {
    navigator.clipboard.writeText('time,raw,smoothed,hue\n' + state.log.join('\n'))
      .then(() => { $('copied').textContent = `copied ${state.log.length} rows`; setTimeout(() => $('copied').textContent = '', 2000); })
      .catch(() => { $('copied').textContent = 'clipboard blocked by browser'; });
  };
  try { const t = localStorage.getItem('pulsoid_token'); if (t) $('token').value = t; } catch (e) {}
  addEventListener('resize', resize); resize(); drawSwatches(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
